<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Expense Tracker</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  form { display: flex; gap: 8px; margin-bottom: 24px; }
  input { padding: 6px 8px; font-size: 0.95rem; }
  input[name="description"] { flex: 1; }
  input[name="amount"] { width: 100px; }
  button { padding: 6px 14px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #ddd; }
  th { font-size: 0.85rem; color: #666; }
  td.amount { text-align: right; font-variant-numeric: tabular-nums; }
  .del-btn { background: none; border: none; color: #c0392b; cursor: pointer; font-size: 1rem; }
  .empty { color: #888; padding: 12px 0; }
  .error { color: #c0392b; margin-bottom: 12px; }
</style>
</head>
<body>
  <h1>Expense Tracker</h1>
  <form id="add-form">
    <input name="description" placeholder="Description" required>
    <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required>
    <button type="submit">Add</button>
  </form>
  <div id="error" class="error"></div>
  <table>
    <thead>
      <tr><th>ID</th><th>Date</th><th>Description</th><th class="amount">Amount</th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

<script>
const form = document.getElementById('add-form');
const rows = document.getElementById('rows');
const errorEl = document.getElementById('error');

async function loadExpenses() {
  errorEl.textContent = '';
  const res = await fetch('/api/expenses');
  const data = await res.json();
  rows.innerHTML = '';
  if (!res.ok) {
    errorEl.textContent = data.error || 'Failed to load expenses';
    return;
  }
  if (data.length === 0) {
    rows.innerHTML = '<tr><td colspan="5" class="empty">No expenses recorded.</td></tr>';
    return;
  }
  for (const e of data) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${e.id}</td>
      <td>${e.date.slice(0, 10)}</td>
      <td>${escapeHtml(e.description)}</td>
      <td class="amount">$${e.amount.toFixed(2)}</td>
      <td><button class="del-btn" data-id="${e.id}" title="Delete">✕</button></td>
    `;
    rows.appendChild(tr);
  }
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  errorEl.textContent = '';
  const description = form.description.value;
  const amount = form.amount.value;
  const res = await fetch('/api/expenses', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ description, amount })
  });
  const data = await res.json();
  if (!res.ok) {
    errorEl.textContent = data.error || 'Failed to add expense';
    return;
  }
  form.reset();
  loadExpenses();
});

rows.addEventListener('click', async (ev) => {
  const btn = ev.target.closest('.del-btn');
  if (!btn) return;
  const id = btn.dataset.id;
  const res = await fetch(`/api/expenses/${id}`, { method: 'DELETE' });
  if (!res.ok && res.status !== 204) {
    const data = await res.json().catch(() => ({}));
    errorEl.textContent = data.error || 'Failed to delete expense';
    return;
  }
  loadExpenses();
});

loadExpenses();
</script>
</body>
</html>
